<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Team Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        header h1 {
            margin-bottom: 10px;
        }

        .home {
            padding: 60px 20px;
            text-align: center;
        }

        .home h2 {
            font-size: 34px;
            margin-bottom: 15px;
        }

        .home p {
            max-width: 600px;
            margin: auto;
            font-size: 18px;
            color: #555;
        }

        .team {
            padding: 60px 20px;
            background: white;
            text-align: center;
        }

        .team h2 {
            margin-bottom: 40px;
            font-size: 28px;
        }

        .team-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .member {
            background: #ecf0f1;
            padding: 20px;
            width: 250px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .member:hover {
            transform: translateY(-10px);
            background: #dfe6e9;
        }

        .member img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        .member h3 {
            margin-bottom: 5px;
        }

        .member p {
            font-size: 14px;
            color: #666;
        }

        footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;

        }
    </style>
</head>
